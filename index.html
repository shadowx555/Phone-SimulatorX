/* ===== PURCHASE ===== */
function buyApp(appId,btn){
  const app=CATALOG.find(a=>a.id===appId);
  if(!app||State.purchased[appId])return;
  if(State.balance<app.price){Sound.error();showToast('Недостаточно средств','error');return;}
  if(btn)btn.classList.add('loading');
  setTimeout(()=>{
    State.balance-=app.price;State.purchased[appId]=true;
    if(!State.installed.includes(appId))State.installed.push(appId);
    saveState();Sound.purchase();
    if(btn){
      btn.classList.remove('loading');
      if(btn.classList.contains('as-buy-btn-large')){
        btn.classList.add('purchased');btn.innerHTML='<span class="btn-content">Открыть</span>';
        btn.dataset.action='open-purchased';
      } else {btn.classList.add('purchased');btn.textContent='✓';btn.disabled=true;}
    }
    showToast(`✓ ${app.name} куплено`,'success');
    const bal=appViewEl.querySelector('.as-balance');
    if(bal)bal.textContent=`💰 $${State.balance.toFixed(2)}`;
    renderHomeScreen();
  },700);
}

let pendingSubApp=null,selectedSubPlan=null;
function openSubModal(appId){
  const app=CATALOG.find(a=>a.id===appId);
  if(!app||!app.subscription)return;
  pendingSubApp=app;selectedSubPlan=app.plans.find(p=>p.best)||app.plans[0];
  const modal=document.createElement('div');
  modal.className='sub-modal active';modal.id='sub-modal';
  let plansHtml='';
  app.plans.forEach(p=>{
    plansHtml+=`<div class="sub-plan ${p.id===selectedSubPlan.id?'selected':''}" data-action="sub-select" data-plan="${p.id}">
      <div class="radio"></div>
      <div class="sub-plan-info">
        <div class="sub-plan-name">${p.name}</div>
        <div class="sub-plan-price">${formatPrice(p.price)}</div>
      </div>${p.best?'<span class="best-badge">Выгодно</span>':''}</div>`;
  });
  modal.innerHTML=`<div class="sub-modal-inner">
    <h3>${escapeHtml(app.name)}</h3>
    <div class="sub-desc">Выберите план подписки</div>${plansHtml}
    <div class="sub-actions">
      <button class="cancel" data-action="sub-cancel">Отмена</button>
      <button class="confirm" data-action="sub-confirm">Подписаться</button>
    </div></div>`;
  const host=appViewEl.querySelector('.app-view-inner')||appViewEl;
  host.style.position='relative';host.appendChild(modal);
  Sound.tap();
}
function closeSubModal(){
  const m=document.getElementById('sub-modal');if(m)m.remove();
  pendingSubApp=null;selectedSubPlan=null;
}
function selectSubPlan(planId){
  if(!pendingSubApp)return;
  selectedSubPlan=pendingSubApp.plans.find(p=>p.id===planId);
  document.querySelectorAll('.sub-plan').forEach(el=>{el.classList.toggle('selected',el.dataset.plan===planId);});
  Sound.tap();
}
function confirmSub(){
  if(!pendingSubApp||!selectedSubPlan)return;
  const app=pendingSubApp,plan=selectedSubPlan;
  if(State.balance<plan.price){Sound.error();showToast('Недостаточно средств','error');return;}
  State.balance-=plan.price;State.subscriptions[app.id]=plan.id;
  if(!State.installed.includes(app.id))State.installed.push(app.id);
  saveState();Sound.purchase();closeSubModal();
  showToast(`✓ Подписка оформлена`,'success');
  renderHomeScreen();
  const bal=appViewEl.querySelector('.as-balance');
  if(bal)bal.textContent=`💰 $${State.balance.toFixed(2)}`;
  if(State.currentApp==='appstore'){appViewEl.innerHTML=renderAppStore();}
  else if(State.currentApp===app.id){appViewEl.innerHTML=renderApp(app.id);setupApp(app.id);}
}

/* ===== EVENT DELEGATION ===== */
screenEl.addEventListener('click',(e)=>{
  if(State.locked&&(e.target.closest('#lock-screen')||lockEl.contains(e.target))){unlockScreen();return;}
  const actionEl=e.target.closest('[data-action]');
  if(!actionEl){
    if(e.target.id==='home-indicator'&&State.currentApp)closeApp();
    return;
  }
  const action=actionEl.dataset.action;
  switch(action){
    case 'open-app': e.stopPropagation(); openApp(actionEl.dataset.app); break;
    case 'close-app': closeApp(); break;
    case 'appstore-home': appViewEl.innerHTML=renderAppStore(); Sound.tap(); break;
    case 'app-detail': e.stopPropagation(); appViewEl.innerHTML=renderAppStoreDetail(actionEl.dataset.app); Sound.tap(); break;
    case 'buy-app': e.stopPropagation(); buyApp(actionEl.dataset.app,actionEl); break;
    case 'open-purchased':
      e.stopPropagation();
      if(State.purchased[actionEl.dataset.app]||State.subscriptions[actionEl.dataset.app]){
        const id=actionEl.dataset.app;
        if(!State.installed.includes(id))State.installed.push(id);
        saveState();openApp(id);
      }
      break;
    case 'open-sub': e.stopPropagation(); openSubModal(actionEl.dataset.app); break;
    case 'sub-select': selectSubPlan(actionEl.dataset.plan); break;
    case 'sub-cancel': closeSubModal(); break;
    case 'sub-confirm': confirmSub(); break;
    case 'calc': calcInput(actionEl.dataset.val); break;
    case 'note-new': appViewEl.innerHTML=renderNotes('new'); Sound.tap(); break;
    case 'note-open': appViewEl.innerHTML=renderNotes(actionEl.dataset.note); Sound.tap(); break;
    case 'note-delete':
      e.stopPropagation();
      State.notes=State.notes.filter(n=>n.id!==actionEl.dataset.note);
      saveState();Sound.tap();appViewEl.innerHTML=renderNotes();
      break;
    case 'note-save': saveNote(actionEl.dataset.note); break;
    case 'notes-list': appViewEl.innerHTML=renderNotes(); Sound.tap(); break;
    case 'music-toggle': toggleMusic(); break;
    case 'music-next': nextTrack(); break;
    case 'music-prev': prevTrack(); break;
    case 'music-track':
      musicState.trackIdx=parseInt(actionEl.dataset.idx,10);
      musicState.elapsed=0;musicState.dur=TRACKS[musicState.trackIdx].dur;
      const wasPlaying=musicState.playing;
      MusicPlayer.stop();
      if(musicState.timer){clearInterval(musicState.timer);musicState.timer=null;}
      musicState.playing=false;
      appViewEl.innerHTML=renderMusic();
      Sound.tap();
      setTimeout(()=>{if(wasPlaying)toggleMusic();},50);
      break;
    case 'camera-shutter': cameraShutter(); break;
    case 'camera-photos': Sound.tap(); appViewEl.innerHTML=renderPhotos(); break;
    case 'camera-flip': Sound.tap(); showToast('Камера переключена'); break;
    case 'photo-view': Sound.tap(); break;
    case 'reset':
      if(confirm('Сбросить все данные?')){localStorage.removeItem('phoneSim_v2');location.reload();}
      break;
    case 'open-app-music': appViewEl.innerHTML=renderMusic();setupApp('music'); break;
    case 'music-pro-sub': openSubModal('music-pro'); break;
    case 'cloudbox-sub': openSubModal('cloudbox'); break;
    case 'vpn-sub': openSubModal('vpn-shield'); break;
    case 'vpn-toggle': vpnOn=!vpnOn;Sound.tap();appViewEl.innerHTML=renderVpn(); break;
    case 'pp-filter':
      const preview=document.getElementById('pp-preview');
      if(preview)preview.style.background=actionEl.dataset.bg;
      document.querySelectorAll('.pp-filter').forEach(el=>el.style.borderColor='transparent');
      actionEl.style.borderColor='#fff';
      Sound.tap();
      break;
    case 'p2048-reset': {
      const p=window.__p2048reset; if(p)p();
      break;
    }
  }
});

document.getElementById('android-nav').addEventListener('click',(e)=>{
  const btn=e.target.closest('button[data-nav]');
  if(!btn)return;

  Sound.tap();
  const nav=btn.dataset.nav;

$('#model-select').addEventListener('change',(e)=>{
  State.model=e.target.value;
  phoneEl.classList.toggle('android',State.model==='android');
  saveState();Sound.tap();
});

/* ===== INIT ===== */
function init(){
  phoneEl.classList.toggle('android',State.model==='android');
  $('#model-select').value=State.model;
  renderHomeScreen();
  screenEl.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&State.currentApp)closeApp();
  });
}
init();
